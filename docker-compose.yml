services:
  db:
    image: postgres:16-alpine
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-primedesk}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-primedesk}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      TZ: America/Sao_Paulo
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-primedesk}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env da raiz}

volumes:
  postgres_data:
