<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeDesk | Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container-fluid">
      <a class="logo" href="index.html">PrimeDesk</a>
    </div>
  </nav>

  <div class="d-flex align-items-center justify-content-center px-3" style="min-height: calc(100vh - 72px);">
    <form class="login-card" id="formLogin" novalidate>
      <h2 class="h4 fw-bold text-center mb-2">Entre em sua conta</h2>
      <p class="text-muted text-center mb-4">Bem-vindo de volta!</p>

      <div id="alerta" class="alerta d-none" aria-live="polite"></div>

      <label class="form-label" for="email_empresa">Email</label>
      <input type="email" id="email_empresa" placeholder="seuemail@empresa.com" class="form-control" maxlength="255" required />

      <label class="form-label mt-3" for="senha_empresa">Senha</label>
      <div class="input-senha">
        <input type="password" id="senha_empresa" placeholder="••••••••" class="form-control" maxlength="72" required />
        <button type="button" class="toggle-senha" id="toggleSenha" aria-label="Mostrar senha" aria-pressed="false">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
        </button>
      </div>

      <div class="text-end mt-2">
        <a href="recuperar.html" class="link-auth small">Esqueceu a senha?</a>
      </div>

      <button type="submit" class="btn-primary w-100 mt-4" id="btnSubmit">Entrar</button>

      <p class="text-center mt-4 small text-muted">
        Não tem conta? <a href="cadastro.html" class="link-auth">Registrar-se</a>
      </p>
    </form>
  </div>

  <script src="js/login.js"></script>

</body>
</html>
