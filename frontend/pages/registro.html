<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDesk | Criar conta</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./landingpage.html">
                <img src="../assets/img/logo.svg" alt="PrimeDesk" width="40">
            </a>
        </div>
    </nav>

    <div class="register-container">
        <div class="register-card">
            <h2 class="title-register">Crie sua conta gratuita</h2>
            <p class="register-subtitle">Nenhum cartão de crédito é necessário!</p>

            <form id="formEmail" method="GET">
                <input type="email" id="inputEmail" name="email" class="form-control" placeholder="Endereço de e-mail" required>
                <button type="submit" class="btn-primary w-100">Continuar com email</button>
            </form>

            <script>
                document.getElementById('formEmail').addEventListener('submit', function(e) {
                    e.preventDefault();
                    const email = document.getElementById('inputEmail').value;
                    window.location.href = `registro-detalhes.html?email=${encodeURIComponent(email)}`;
                });
            </script>

            <div class="divider">
                <span>OU</span>
            </div>

            <button class="btn-google">
                <img src="https://www.google.com/favicon.ico" width="18" alt="Google"> 
                Inscrever-se com Google
            </button>
            
            <p class="mt-5 small text-muted">
                Já tem uma conta? <a href="login.html" class="text-primary text-decoration-none fw-bold">Entrar</a>
            </p>
        </div>
    </div>
</body>
</html>
