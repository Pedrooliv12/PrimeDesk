<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDesk | Criar conta</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/registro.css">
</head>
<body>

    <div class="register-container">
        <a href="landingpage.html" class="logo-text">
            <span style="color: #006bff;">Prime</span>Desk
        </a>

        <h2 class="fw-800 mb-2">Crie sua conta gratuita</h2>
        <p class="text-secondary mb-4">Nenhum cartão de crédito é necessário!</p>

        <form action="registro-detalhes.html" method="GET">
            <input type="email" name="email" class="form-control" placeholder="Endereço de e-mail" required>
            <button type="submit" class="btn-continue">Continuar com email</button>
        </form>

        <div class="divider">
            <span>OU</span>
        </div>

        <button class="btn-google">
            <img src="https://www.google.com/favicon.ico" width="18" alt="Google"> 
            Inscrever-se com Google
        </button>
        
        <p class="mt-5 small text-secondary">
            Já tem uma conta? <a href="login.html" class="text-primary text-decoration-none fw-bold">Entrar</a>
        </p>
    </div>
</body>
</html>
