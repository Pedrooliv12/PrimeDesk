<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Registro | PrimeDesk</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/registro-detalhes.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="logo" name="logo" href="./landingpage.html">
                <img src="../assets/img/logo.svg" alt="PrimeDesk" style="width: 50px;">
            </a>
        </div>
    </nav>

    <div class="details-container">
        <div class="details-card">
            <div class="text-center mb-4">
                <h2 class="title-details">Configure seu perfil</h2>
                <p class="details-subtitle">Estamos quase lá.</p>
            </div>

        <!-- DEVE SER UM POST PARA SALVAR NO BACK END O CADASTRO -->
         
        <form id="formCadastro">
            
            <label class="form-label">Seu e-mail</label>
            <input type="email" id="input-email" class="form-control" readonly>

            <label class="form-label">Nome da Empresa</label>
            <input type="text" id="input-nome" class="form-control" placeholder="Ex: Minha Empresa LTDA" required autofocus>

            <label class="form-label">Crie uma Senha</label>
            <input type="password" id="input-senha" class="form-control" placeholder="Mínimo 8 caracteres" required>

            <button type="submit" class="btn-finish-reg">Criar Conta</button>
            <p id="mensagem-erro" class="text-danger small mt-2" style="display: none;"></p>
            <p id="mensagem-sucesso" class="text-success small mt-2" style="display: none;"></p>
        </form>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const emailURL = urlParams.get('email');
            
            if (emailURL) {
                document.getElementById('input-email').value = emailURL;
            }
        };

        document.getElementById('formCadastro').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('input-email').value;
            const nome = document.getElementById('input-nome').value;
            const senha = document.getElementById('input-senha').value;
            const erroMsg = document.getElementById('mensagem-erro');
            const sucessoMsg = document.getElementById('mensagem-sucesso');

            erroMsg.style.display = 'none';
            sucessoMsg.style.display = 'none';

            if (senha.length < 8) {
                erroMsg.textContent = 'A senha deve ter no mínimo 8 caracteres.';
                erroMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome_empresa: nome,
                        email_empresa: email,
                        senha_empresa: senha
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    sucessoMsg.textContent = 'Conta criada com sucesso! Redirecionando...';
                    sucessoMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 2000);
                } else {
                    erroMsg.textContent = data.message || 'Erro ao criar conta.';
                    erroMsg.style.display = 'block';
                }
            } catch (error) {
                erroMsg.textContent = 'Erro de conexão. Tente novamente.';
                erroMsg.style.display = 'block';
                console.error('Erro:', error);
            }
        });
    </script>
</body>
</html>
