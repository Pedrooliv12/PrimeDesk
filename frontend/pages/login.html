<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrimeDesk - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="./index.html">
                <img src="../assets/img/logo.svg" alt="PrimeDesk" width="40">
            </a>
        </div>
    </nav>

    <div class="d-flex align-items-center justify-content-center min-vh-100 px-3">
        <form class="login-card">
            <h2 class="h4 fw-bold text-center mb-2">Entre em sua conta</h2>
            <p class="text-muted text-center mb-4">Bem-vindo de volta!</p>

            <label class="form-label">Email</label>
            <input type="email" placeholder="seuemail@empresa.com" class="form-control" required>

            <label class="form-label">Senha</label>
            <input type="password" placeholder="••••••••" class="form-control" required>

            <button type="submit" class="btn btn-primary w-100 mt-3">Entrar</button>

            <a href="./esquecer-senha.html" class="forgot-password d-block text-center mt-3">Esqueci minha senha</a>
            
            <p class="text-center text-muted mt-4 small">Não tem conta? <a href="./registro.html" class="text-primary fw-bold text-decoration-none">Criar conta</a></p>
        </form>
    </div>

</body>
</html>
