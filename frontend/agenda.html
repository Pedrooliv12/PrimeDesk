<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeDesk | Agendar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/agenda.css" />
</head>
<body>
  <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

  <nav class="navbar">
    <div class="container-fluid">
      <span class="logo">PrimeDesk</span>
    </div>
  </nav>

  <div class="page-container" id="conteudo-principal">

    <div id="loading" class="estado-vazio">
      <p class="text-muted">Carregando agenda...</p>
    </div>

    <div id="erro" class="estado-vazio d-none">
      <p class="text-muted">Agenda não encontrada.</p>
    </div>

    <div id="indisponivel" class="estado-vazio d-none">
      <p class="text-muted">Esta agenda está temporariamente indisponível. Por favor, tente novamente mais tarde.</p>
    </div>

    <div id="conteudo" class="d-none">
      <div class="page-header">
        <h1 id="nomeEmpresa" class="h3 fw-bold"></h1>
        <p class="text-muted">Escolha um profissional e um horário disponível</p>
      </div>

      <div id="listaProfissionais" class="profissionais-grid"></div>
    </div>

  </div>

  <!-- Modal de confirmação -->
  <div class="modal-overlay d-none" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitulo">
    <div class="modal-card">
      <h3 class="h5 fw-bold mb-1" id="modalTitulo">Confirmar agendamento</h3>
      <p class="text-muted small mb-4" id="modalResumo"></p>

      <div id="modalAlerta" class="alerta d-none" aria-live="polite"></div>

      <label class="form-label">Nome completo</label>
      <input type="text" id="nomeCliente" placeholder="Seu nome" class="form-control mb-3" maxlength="100" />

      <label class="form-label">WhatsApp</label>
      <input type="tel" id="whatsappCliente" placeholder="(11) 99999-9999" class="form-control mb-4" maxlength="15" inputmode="numeric" autocomplete="tel" />

      <div class="d-flex gap-2">
        <button class="btn-secondary flex-fill" id="btnCancelar">Cancelar</button>
        <button class="btn-primary flex-fill" id="btnConfirmar">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="js/agenda.js"></script>

</body>
</html>
