<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeDesk | Criar conta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/cadastro.css" />
</head>
<body>

  <nav class="navbar">
    <div class="container-fluid">
      <a class="logo" href="index.html">PrimeDesk</a>
    </div>
  </nav>

  <div class="register-container">
    <div class="register-card">
      <h2 class="title-register">Crie sua conta gratuita</h2>
      <p class="register-subtitle">Nenhum cartão de crédito é necessário!</p>

      <div id="alerta" class="alerta d-none"></div>

      <form id="formCadastro" novalidate>
        <input
          type="text"
          id="nome_empresa"
          class="form-control"
          placeholder="Nome da empresa"
          maxlength="150"
          required
        />
        <input
          type="email"
          id="email_empresa"
          class="form-control"
          placeholder="Endereço de e-mail"
          maxlength="255"
          required
        />
        <div class="input-senha">
          <input
            type="password"
            id="senha_empresa"
            class="form-control"
            placeholder="Senha (mínimo 6 caracteres)"
            maxlength="72"
            required
          />
          <button type="button" class="toggle-senha" id="toggleSenha" tabindex="-1">
            <svg id="iconOlho" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="btn-primary w-100" id="btnSubmit">
          Criar minha conta
        </button>
      </form>

      <p class="mt-4 small text-muted">
        Já tem uma conta? <a href="login.html" class="link-auth">Entrar</a>
      </p>
    </div>
  </div>

  <script src="js/cadastro.js"></script>
</body>
</html>
